<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Just Do It</title>
  <meta name="description" content="Design your life, track habits and learn 100 skills in 365 days — with a schedule, timer and alarms.">
  <meta name="theme-color" content="#dff3ff">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Just Do It">
  <link rel="preload" href="fonts/SourceSans3-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Frutiger Aero backdrop: sky, light rays, a grassy horizon and floating bubbles. Decorative only. -->
  <div class="aero-bg" aria-hidden="true">
    <div class="aero-rays"></div>
    <div class="cloud" style="--x:-8%;--y:7%;--w:55vw"></div>
    <div class="cloud" style="--x:52%;--y:16%;--w:42vw"></div>
    <div class="cloud" style="--x:18%;--y:30%;--w:34vw"></div>
    <i class="bokeh" style="--x:78%;--y:9%;--s:90px"></i>
    <i class="bokeh" style="--x:88%;--y:22%;--s:40px"></i>
    <i class="bokeh" style="--x:6%;--y:52%;--s:60px"></i>
    <div class="aero-hill"></div>
    <i class="bubble" style="--x:8%;--s:46px;--d:19s;--w:-2s"></i>
    <i class="bubble" style="--x:22%;--s:18px;--d:14s;--w:-9s"></i>
    <i class="bubble" style="--x:37%;--s:70px;--d:26s;--w:-4s"></i>
    <i class="bubble" style="--x:55%;--s:28px;--d:17s;--w:-12s"></i>
    <i class="bubble" style="--x:68%;--s:54px;--d:23s;--w:-7s"></i>
    <i class="bubble" style="--x:83%;--s:22px;--d:15s;--w:-1s"></i>
    <i class="bubble" style="--x:92%;--s:38px;--d:21s;--w:-15s"></i>
  </div>
  <header class="topbar">
    <a class="brand" href="#today"><img src="icons/icon.svg" alt="" width="28" height="28"><span>Just Do It</span></a>
    <div id="topbar-actions">
      <button class="icon-btn" data-view="vision" aria-label="Life: vision, environment, people">✨</button>
      <button class="icon-btn" data-view="settings" aria-label="Settings and backup">⚙</button>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Main">
    <button data-view="today"><span aria-hidden="true">☀</span>Today</button>
    <button data-view="habits"><span aria-hidden="true">✓</span>Habits</button>
    <button data-view="skills"><span aria-hidden="true">🎯</span>Skills</button>
    <button data-view="calendar"><span aria-hidden="true">📅</span>Schedule</button>
    <button data-view="timer"><span aria-hidden="true">⏱</span>Timer</button>
    <button data-view="alarms"><span aria-hidden="true">⏰</span>Alarms</button>
  </nav>

  <dialog id="sheet" class="sheet"></dialog>
  <dialog id="whats-new" class="sheet"></dialog>
  <div id="alarm-overlay" class="alarm-overlay" role="alertdialog" aria-label="Alarm" hidden></div>
  <div id="night" class="night" hidden></div>
  <div id="update-bar" class="update-bar" role="status" hidden>
    <span>✨ A new version is ready. Your data stays on this phone.</span>
    <button id="update-now" class="btn primary small">Update</button>
    <button id="update-later" class="icon-btn" aria-label="Later">✕</button>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript><p style="padding:2rem">Just Do It needs JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
