<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Just Do It</title>
  <meta name="description" content="Design your life, track habits and learn 100 skills in 365 days — with a schedule, timer and alarms.">
  <meta name="theme-color" content="#fbf4ec">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Just Do It">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#today"><img src="icons/icon.svg" alt="" width="28" height="28"><span>Just Do It</span></a>
    <div id="topbar-actions">
      <button class="icon-btn" data-view="vision" aria-label="Life: vision, environment, people">✨</button>
      <button class="icon-btn" data-view="settings" aria-label="Settings and backup">⚙</button>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Main">
    <button data-view="today"><span aria-hidden="true">☀</span>Today</button>
    <button data-view="habits"><span aria-hidden="true">✓</span>Habits</button>
    <button data-view="skills"><span aria-hidden="true">🎯</span>Skills</button>
    <button data-view="calendar"><span aria-hidden="true">📅</span>Schedule</button>
    <button data-view="timer"><span aria-hidden="true">⏱</span>Timer</button>
    <button data-view="alarms"><span aria-hidden="true">⏰</span>Alarms</button>
  </nav>

  <dialog id="sheet" class="sheet"></dialog>
  <dialog id="whats-new" class="sheet"></dialog>
  <div id="alarm-overlay" class="alarm-overlay" role="alertdialog" aria-label="Alarm" hidden></div>
  <div id="night" class="night" hidden></div>
  <div id="update-bar" class="update-bar" role="status" hidden>
    <span>✨ A new version is ready. Your data stays on this phone.</span>
    <button id="update-now" class="btn primary small">Update</button>
    <button id="update-later" class="icon-btn" aria-label="Later">✕</button>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript><p style="padding:2rem">Just Do It needs JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
